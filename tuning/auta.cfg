; =====================================================================
;  NEON WRECK - NASTAVENI JIZDY AUT
; =====================================================================
;  Tady se ladi, jak se auta chovaji. Staci zmenit cislo, ulozit
;  a hru spustit znovu (nebo ve hre zmacknout F6 = znovu nacist).
;
;  Sekce [vychozi] plati pro vsechna auta.
;  Sekce konkretniho auta (napr. [ulicni]) prepisuje jen to, co uvede.
;
;  Radky zacinajici strednikem ";" jsou poznamky, hra je ignoruje.
;  Desetinna cisla pis s TECKOU (1.5), ne s carkou.
; =====================================================================

[vychozi]

; --- Zakladni ---
nazev = "Auto"
barva = Color(0.8, 0.8, 0.8, 1.0)   ; barva laku (cervena, zelena, modra, 1.0)
rozmery = Vector3(1.9, 1.2, 4.5)    ; sirka, vyska, delka karoserie v metrech
hmotnost = 1200.0              ; kg. Tezsi auto vic tlaci soupere, ale pomaleji zrychluje.
max_rychlost = 200.0           ; km/h bez nitra
sila_motoru = 9000.0           ; N. Vic = rychlejsi zrychleni.
pohon = "zadni"                ; "zadni", "predni" nebo "vsechna"
rychlost_couvani = 40.0        ; km/h

; --- Brzdy ---
sila_brzd = 14000.0            ; N
sila_rucni_brzdy = 5000.0      ; N, jak moc rucni brzda zpomaluje

; --- Zataceni ---
max_natoceni_kol = 34.0        ; stupne pri nizke rychlosti
natoceni_ve_vysoke_rychlosti = 0.35  ; 0-1, kolik zataceni zbude v max. rychlosti
rychlost_volantu = 3.5         ; jak rychle se kola natoci (vic = ostrejsi reakce)
pomoc_zataceni = 1.0           ; arkadova pomoc pri zataceni (0 = vypnuto, 2 = hodne)

; --- Prilnavost ---
prilnavost_predni = 1.6        ; vic = auto drzi lip v zatacce
prilnavost_zadni = 1.5         ; mene nez predni = auto snaz pretaci zadek
prilnavost_rucni_brzda = 0.30  ; 0-1, kolik zadni prilnavosti zbude pri rucni brzde
prilnavost_v_driftu = 0.55     ; 0-1, prilnavost zadku, kdyz uz auto klouze bokem
uhel_zacatku_driftu = 12.0     ; stupne, od kdy se pocita smyk jako drift
pomoc_driftu = 1.0             ; pomaha udrzet a ridit drift (0 = vypnuto)
max_uhel_driftu = 55.0         ; stupne, vetsi uhel driftu auto samo srovna (proti roztoceni)

; --- Podvozek ---
propad_podvozku = 0.14         ; m, jak moc auto "sedne" na pruzinach
tlumeni = 0.35                 ; 0-1, vic = mene houpani
polomer_kola = 0.36            ; m
zdvih_pruziny = 0.32           ; m
pritlak = 2.0                  ; aerodynamicky pritlak ve vysoke rychlosti

; --- Nitro ---
nitro_sila = 1.6               ; nasobek sily motoru pri nitru
nitro_max_rychlost = 1.20      ; nasobek max. rychlosti pri nitru
nitro_spotreba = 0.30          ; kolik nadrze spotrebuje za sekundu (1 = cela nadrz)
nitro_dobijeni = 0.03          ; samovolne dobijeni za sekundu
nitro_za_drift = 0.12          ; dobijeni za sekundu driftu

; --- Odolnost (poskozeni) ---
odolnost = 1.0                 ; vic = auto vydrzi vic narazu
prah_poskozeni = 3.0           ; m/s, slabsi naraz auto neposkodi


; =====================================================================
;  AUTA  (klavesy 1, 2, 3 v testovaci arene)
; =====================================================================

[ulicni]
; Vyvazene ulicni auto se zadnim nahonem. Dobre na drift.
nazev = "Vortex GT (ulicni)"
barva = Color(0.9, 0.08, 0.45, 1.0)

[svalovec]
; Tezky americky svalovec. Silny motor, horsi zataceni, vydrzi hodne.
nazev = "Brute V8 (svalovec)"
barva = Color(0.95, 0.55, 0.05, 1.0)
hmotnost = 1650.0
sila_motoru = 13500.0
max_rychlost = 210.0
prilnavost_predni = 1.4
prilnavost_zadni = 1.25
max_natoceni_kol = 30.0
odolnost = 1.6
rozmery = Vector3(2.0, 1.25, 4.9)

[rally]
; Lehke auto s pohonem vsech kol. Skvele zrychleni a prilnavost, mene odolne.
nazev = "Kestrel R4 (rally)"
barva = Color(0.1, 0.7, 1.0, 1.0)
hmotnost = 1050.0
sila_motoru = 8800.0
max_rychlost = 185.0
pohon = "vsechna"
prilnavost_predni = 1.8
prilnavost_zadni = 1.75
prilnavost_v_driftu = 0.7
max_natoceni_kol = 38.0
odolnost = 0.8
rozmery = Vector3(1.8, 1.3, 4.1)
