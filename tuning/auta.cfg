; =====================================================================
;  NEON WRECK - NASTAVENI JIZDY AUT
; =====================================================================
;  Tady se ladi, jak se auta chovaji. Staci zmenit cislo, ulozit
;  a ve hre zmacknout F6 (znovu nacist) - neni potreba restart.
;
;  Sekce [vychozi] plati pro vsechna auta.
;  Sekce konkretniho auta (napr. [octavia]) prepisuje jen to, co uvede.
;
;  Radky zacinajici strednikem ";" jsou poznamky, hra je ignoruje.
;  Desetinna cisla pis s TECKOU (1.5), ne s carkou.
; =====================================================================

[vychozi]

; --- Zakladni ---
nazev = "Auto"
model = "octavia"              ; 3D model (viz data/modely_aut.cfg)
barva = Color(0.8, 0.8, 0.8, 1.0)   ; barva laku (cervena, zelena, modra, 1.0)
hmotnost = 1400.0              ; kg
vykon_kw = 150.0               ; vykon motoru v kW (1 kW = 1.36 koni)
max_rychlost = 230.0           ; km/h bez nitra
pohon = "zadni"                ; "zadni", "predni" nebo "vsechna"
rychlost_couvani = 40.0        ; km/h

; --- Prevodovka (automaticka) ---
pocet_rychlosti = 6
max_otacky = 7000.0            ; otacky omezovace (cervene pole na otackomeru)
volnobezne_otacky = 900.0

; --- Brzdy ---
sila_brzd = 15000.0            ; N
sila_rucni_brzdy = 5000.0      ; N, jak moc rucni brzda zpomaluje

; --- Zataceni ---
max_natoceni_kol = 34.0        ; stupne pri nizke rychlosti
natoceni_ve_vysoke_rychlosti = 0.32  ; 0-1, kolik zataceni zbude v max. rychlosti
rychlost_volantu = 3.2         ; jak rychle se kola natoci (vic = ostrejsi reakce)
pomoc_zataceni = 1.0           ; arkadova pomoc pri zataceni (0 = vypnuto, 2 = hodne)

; --- Prilnavost ---
mokra_silnice = 0.78           ; nasobek prilnavosti vsech aut (1 = sucho, mene = klouzavejsi)
prilnavost_predni = 1.30       ; vic = auto drzi lip v zatacce
prilnavost_zadni = 1.22        ; mene nez predni = zadek snaz ujizdi
uhel_max_prilnavosti = 7.0     ; stupne smyku, kdy pneumatika drzi nejvic
prilnavost_ve_smyku = 0.68     ; 0-1, kolik prilnavosti zbude, kdyz auto klouze bokem
prilnavost_rucni_brzda = 0.32  ; 0-1, kolik zadni prilnavosti zbude pri rucni brzde
pomoc_driftu = 1.0             ; pomaha udrzet a ridit drift (0 = vypnuto)
max_uhel_driftu = 55.0         ; stupne, vetsi uhel driftu auto samo srovna (proti roztoceni)

; --- Podvozek ---
propad_podvozku = 0.12         ; m, jak moc auto "sedne" na pruzinach
tlumeni = 0.38                 ; 0-1, vic = mene houpani
zdvih_pruziny = 0.30           ; m
pritlak = 1.5                  ; aerodynamicky pritlak ve vysoke rychlosti
vyska_teziste = 0.42           ; m nad zemi, niz = stabilnejsi auto

; --- Nitro ---
nitro_vykon = 1.5              ; nasobek vykonu motoru pri nitru
nitro_spotreba = 0.28          ; kolik nadrze spotrebuje za sekundu (1 = cela nadrz)
nitro_dobijeni = 0.025         ; samovolne dobijeni za sekundu
nitro_za_drift = 0.12          ; dobijeni za sekundu driftu

; --- Odolnost (poskozeni) ---
odolnost = 1.0                 ; vic = auto vydrzi vic narazu (2 = dvakrat vic)
prah_poskozeni = 7.0           ; m/s (asi 25 km/h), slabsi naraz auto vubec neposkodi


; =====================================================================
;  AUTA  (klavesy 1, 2, 3 ve hre)
;  Hodnoty podle skutecnych aut (vykon, hmotnost, pohon, max. rychlost).
; =====================================================================

