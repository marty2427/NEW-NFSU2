; =====================================================================
;  NEON WRECK - NASTAVENI JIZDY AUT
; =====================================================================
;  Tady se ladi, jak se auta chovaji. Staci zmenit cislo, ulozit
;  a ve hre zmacknout F6 (znovu nacist) - neni potreba restart.
;
;  Sekce [vychozi] plati pro vsechna auta.
;  Sekce konkretniho auta (napr. [octavia]) prepisuje jen to, co uvede.
;
;  Radky zacinajici strednikem ";" jsou poznamky, hra je ignoruje.
;  Desetinna cisla pis s TECKOU (1.5), ne s carkou.
; =====================================================================

[vychozi]

; --- Zakladni ---
nazev = "Auto"
model = "octavia"              ; 3D model (viz data/modely_aut.cfg)
zvuk_motoru = "r4"             ; r4 = ctyrvalec s turbem, r4s = chraplavy ctyrvalec, v8 = osmivalec, r6 = sestivalec bez turba,
                               ; r6t = sestivalec s turbem (hlubsi), r6s = sestivalec s turbem (chraplavy), boxer = plochy ctyrvalec, rot = wankel
barva = Color(0.8, 0.8, 0.8, 1.0)   ; barva laku (cervena, zelena, modra, 1.0)
hmotnost = 1400.0              ; kg
vykon_kw = 150.0               ; vykon motoru v kW (1 kW = 1.36 koni)
max_rychlost = 230.0           ; km/h bez nitra
pohon = "zadni"                ; "zadni", "predni" nebo "vsechna"
rychlost_couvani = 40.0        ; km/h

; --- Prevodovka (automaticka) ---
pocet_rychlosti = 6
max_otacky = 7000.0            ; otacky omezovace (cervene pole na otackomeru)
volnobezne_otacky = 900.0

; --- Brzdy ---
sila_brzd = 10500.0            ; N (mene = brzdi mekceji)
sila_rucni_brzdy = 5000.0      ; N, jak moc rucni brzda zpomaluje

; --- Zataceni ---
ostrost_zataceni = 30.0        ; jak ostre auto zatoci (vic = auto se pri zataceni vic "pohne"). 20 = klidne, 32 = hodne ostre
ostrost_ve_vysoke_rychlosti = 0.8  ; 0-1, kolik ostrosti zbude v maximalni rychlosti (mene = klidnejsi auto na rovince)
rychlost_volantu = 5.0         ; jak rychle reaguje volant na klavesu (vic = okamzite, mene = plynule)
odezva_rizeni = 9.0            ; jak rychle se auto zacne otacet (vic = zivejsi, mene = tezsi auto)
max_otaceni = 2.2              ; nejvyssi rychlost otaceni auta (rad/s) v male rychlosti
max_natoceni_kol = 38.0        ; stupne (urcuje nejmensi polomer otaceni pri parkovani)
natoceni_kol_vizual = 1.0      ; jak moc jsou videt natocena predni kola (jen vzhled)

; --- Prilnavost ---
prilnavost = 2.0               ; bocni prilnavost v "g". Urcuje, jak rychle jde projet zatacku. 1.4 = klouzave, 2.2 = jako po kolejich
mokra_silnice = 0.95           ; nasobek prilnavosti na mokru (1 = sucho)
max_uhel_smyku = 13.0          ; stupne: o kolik muze auto v ostre zatacce "vybocit" zadkem, nez se otaceni zbrzdi
smyk_plynem = 0.0              ; 0-1: plny plyn v zatacce povoli vetsi smyk (zadni nahon)
tuhost_prilnavosti = 10.0      ; jak rychle se auto po smyku "chyti" (vic = ostreji)
naklon_karoserie = 0.22        ; jak moc se karoserie v zatacce naklani (0 = vubec)
zataceni_bez_plynu = 0.35      ; o kolik ostreji auto zatoci, kdyz v zatacce uberes plyn (0.35 = o 35 %)
ubrani_v_zatacce = 0.4         ; prudka zatacka v rychlosti auto zpomali, aby ji vybralo (0 = vubec)

; --- Odpruzeni a "tiha" ---
extra_gravitace = 0.6          ; auto je arkadove tezsi: neplachti po hrbolech a skoky jsou kratsi (0 = realne)
pritlak = 2.4                  ; pritlak v rychlosti (drzi auto na silnici)

; --- Drift (zacina RUCNI BRZDOU v zatacce, pak plyn + volant) ---
drift_vstup = 0.12             ; s, jak dlouho drzet rucni brzdu v zatacce, nez zacne drift
prilnavost_rucni_brzda = 0.35  ; 0-1, kolik prilnavosti zbude pri zatazene rucni brzde
prilnavost_v_driftu = 0.6      ; 0-1, prilnavost behem driftu (mene = delsi klouzani)
otaceni_v_driftu = 1.2         ; jak rychle se auto v driftu otaci volantem (rad/s)
pomoc_driftu = 1.0             ; udrzi rychlost v driftu (0 = vypnuto)
max_uhel_driftu = 175.0        ; stupne: az do jakeho uhlu se da auto v driftu pretocit (175 = klidne se roztoci)
vedeni_driftu = 0.45           ; jak moc se smer jizdy v driftu stoci za predkem auta (vic = auto "vede", mene = volnejsi)

